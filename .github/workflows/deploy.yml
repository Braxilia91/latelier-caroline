name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # URLs publiques des Workers Cloudflare — injectées au build Vite
          # pour que `import.meta.env.VITE_*` soit inliné dans le bundle.
          # Hardcoded ici car publiques (visibles dans le bundle JS final
          # de toute façon) : pas de valeur ajoutée à les passer en secret.
          VITE_SYNC_WORKER_URL: https://atelier-sync.atome-tdah-cloud.workers.dev
          VITE_WORKER_URL:      https://latelier-api.atome-tdah-cloud.workers.dev
          # LOT 4F.2.1 — Client ID OAuth Web (Google Identity Services).
          # Public par design : présent dans le bundle JS final.
          VITE_GOOGLE_CLIENT_ID: 1020255079677-cpq2rkjauvj1678d9tpkdgvmgdot4jnp.apps.googleusercontent.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ad277d19b37865f39bad4ced32f38b42
          projectName: latelier-caroline
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
