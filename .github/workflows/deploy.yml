name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deployment via API
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/cf_response.json -w "%{http_code}" \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/ad277d19b37865f39bad4ced32f38b42/pages/projects/latelier-caroline/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}')
          cat /tmp/cf_response.json
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered successfully (HTTP $HTTP_STATUS)"
          else
            echo "Deploy failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
