# .github/workflows/ci.yml
# Gate de qualité avant deploy Cloudflare Pages
# Les tests doivent passer — sinon le push est bloqué côté CI
# (Cloudflare Pages détecte le push et deploy indépendamment — ce workflow valide en amont)

name: CI — Tests avant deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest — sync error paths
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test
        env:
          VITE_SYNC_WORKER_URL: https://fake-worker-ci.example.com
        # Si les 5 tests échouent → le job fail → Cloudflare Pages voit le commit
        # mais le dev sait qu'il y a un problème avant que Caroline reçoive un build cassé
